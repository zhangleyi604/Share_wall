<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>一起贴贴 · 协作墙</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="overlay">
    <div class="card">
      <h1>🧱 一起贴贴</h1>
      <p class="sub">进同一个房间链接，和朋友实时贴便签</p>
      <label>你的昵称</label>
      <input id="name" maxlength="24" placeholder="比如：小明" />
      <label>房间号</label>
      <input id="room" maxlength="64" placeholder="留空就是 lobby 大厅" />
      <button id="enter">进入房间 →</button>
      <p class="tip">把房间链接发给朋友，Ta 进来就能一起贴</p>
    </div>
  </div>

  <header id="topbar">
    <div class="left">
      <span class="logo">🧱</span>
      <span>房间 <b id="roomLabel">-</b></span>
      <span class="online">🟢 <b id="count">0</b> 人在线</span>
    </div>
    <div class="right">
      <button id="addNote">＋ 贴便签</button>
      <button id="copyLink">复制房间链接</button>
      <button id="clearWall" class="ghost">清空墙</button>
    </div>
  </header>

  <main id="wall">
    <canvas id="board"></canvas>
  </main>

  <div id="boardTools">
    <div class="bt-row">
      <span class="bt-label">画笔</span>
      <span class="bcolor active" data-color="#222" style="background:#222"></span>
      <span class="bcolor" data-color="#e23b3b" style="background:#e23b3b"></span>
      <span class="bcolor" data-color="#2f7de0" style="background:#2f7de0"></span>
      <span class="bcolor" data-color="#2faf5a" style="background:#2faf5a"></span>
      <span class="bcolor" data-color="#f5a623" style="background:#f5a623"></span>
      <button id="erase" class="bt-btn">橡皮</button>
    </div>
    <div class="bt-row">
      <span class="bt-label">粗细</span>
      <button class="bt-btn w" data-w="3">细</button>
      <button class="bt-btn w active" data-w="6">中</button>
      <button class="bt-btn w" data-w="12">粗</button>
      <button id="clearBoard" class="bt-btn danger">清画板</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
